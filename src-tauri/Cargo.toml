[package]
name = "mailview"
version = "0.3.1"
description = "A local-first desktop job-search tracker"
authors = ["Viktor Lundin"]
license = "MIT"
edition = "2021"
rust-version = "1.88"

[lib]
name = "mailview_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "mailview"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tracing-appender", "dep:tauri-plugin-dialog"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
tauri = { version = "2", features = [], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "io-util", "time"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
regex = "1"
html2text = "0.17"
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = { version = "0.2", optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
async-trait = "0.1"
base64 = "0.22"
mailparse = "0.16"
encoding_rs = "0.8"
httpdate = "1"
getrandom = "0.3"
zeroize = { version = "1", features = ["derive"] }
webbrowser = "1"

[target.'cfg(windows)'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["windows-native"] }
windows-sys = { version = "0.60", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Com"] }

[dev-dependencies]
tempfile = "3"
